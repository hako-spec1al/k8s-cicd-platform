name: CI

on:
    push:
        branches: [main, phase-8-observability]
        paths-ignore:
            - helm/platform-api/values-dev.yaml
    pull_request:

#or use this (still the same)
# on:
#     pull_request:
#     push:
#         branches:
#             - main

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install dependencies
              run: python -m pip install -r requirements.txt

            - name: Run tests
              run: python -m pytest -q
    build-and-push:
        name: Build and push image
        needs: [test, gitleaks]
        # if: github.event_name == 'push'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Generate image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/hako-spec1al/k8s-cicd-platform
                  tags: |
                      type=sha, format=long, prefix=sha-

            - name: Build image locally
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha, mode=max

            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: ${{ steps.meta.outputs.tags }}
                  format: table
                  exit-code: '0'
                  ignore-unfixed: true
                  scanners: vuln
                  severity: CRITICAL,HIGH

            - name: Log in to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push scanned image
              if: github.event_name == 'push'
              env:
                  IMAGE_REF: ${{ steps.meta.outputs.tags }}
              run: docker push "$IMAGE_REF"

            - name: Export image tag
              run: |
                  echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

    create-deployment-pr:
        name: Create deloyment PR
        needs: build-and-push
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Install yq
              uses: dcarbone/install-yq-action@v1.1.1
              with:
                  version: "v4.44.3"

            - name: Update Helm values
              env:
                  IMAGE_TAG: sha-${{ github.sha }}
              run: |
                  yq -i '.image.repository = "ghcr.io/hako-spec1al/k8s-cicd-platform"' helm/platform-api/values-dev.yaml
                  yq -i '.image.tag = env(IMAGE_TAG)' helm/platform-api/values-dev.yaml
                  yq -i '.appVersion = env(IMAGE_TAG)' helm/platform-api/values-dev.yaml

            - name: Create deployment pull request
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: automation/update-platform-api-image-${{ github.ref_name }}
                  delete-branch: true
                  base: ${{ github.ref_name }}
                  title: "chore: update platform api image"
                  commit-message: "chore: update platform api image to ${{ github.sha }}"
                  body: |
                      Updates the platform API image to:
                        ghcr.io/hako-spec1al/k8s-cicd-platform:sha-${{ github.sha }}

                        Merge this pull request into ${{ github.ref_name }} to deploy it with Argo CD.
                  labels: |
                      deployment
                      automated
    gitleaks:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
